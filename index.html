<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLACKOUT / Production Hub 2.2</title><style>
:root{color-scheme:dark;--bg:#0a0e15;--panel:#121a26;--line:#263344;--fg:#ecf2fa;--muted:#98a8ba;--cyan:#70dbf8;--green:#64d7a3;--red:#ff8586;--amber:#eac374}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#142d3a 0%,transparent 45%),var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button,input,select,textarea{border:1px solid var(--line);border-radius:8px;background:#101722;padding:10px 12px}input,select,textarea{width:100%;min-width:0}textarea{resize:vertical}button:hover{border-color:var(--cyan)}button.primary{background:var(--cyan);color:#09212c;border:0;font-weight:750}button.small{padding:6px 10px;font-size:12px}.danger{color:var(--red)}.muted,small{color:var(--muted)}.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}aside{padding:26px 18px;border-right:1px solid var(--line);background:#0d141e;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}.brand{font-size:25px;font-weight:900;letter-spacing:.13em;color:var(--cyan)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted)}nav button.on{background:#1d3442;color:var(--cyan);border-color:#2d505e}aside footer{margin-top:auto;font-size:11px;color:var(--muted)}main{max-width:1400px;width:100%;padding:30px 36px;margin:auto;align-self:start}header{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}h1{font-size:clamp(25px,4vw,38px);letter-spacing:-.04em;line-height:1.1;margin:6px 0 10px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}.panel{border:1px solid var(--line);background:var(--panel);padding:19px;border-radius:14px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:34px;display:block;line-height:1.3;font-variant-numeric:tabular-nums}.progress{height:7px;background:#293647;border-radius:12px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:var(--cyan)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.person{min-height:145px;display:flex;flex-direction:column;gap:8px;cursor:pointer}.person:hover{border-color:var(--cyan)}.tag{display:inline-block;width:fit-content;font-size:11px;font-weight:700;padding:3px 8px;border:1px solid var(--line);border-radius:20px}.Sopra{color:#8abaff}.Sotto{color:#68e0c5}.Dentro{color:#c9a6ff}.done{color:var(--green)}.late{color:var(--red)}.blocked{color:var(--amber)}.active{color:var(--cyan)}.task{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.task:last-child{border:0}.task label{font-weight:650;display:flex;gap:9px;align-items:flex-start}.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);flex:none;margin:3px 0}.task p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{display:grid;gap:5px;color:var(--muted);font-size:12px}.wide{grid-column:1/-1}.empty{padding:24px 0;color:var(--muted)}.filters{display:flex;gap:8px;margin:10px 0 18px;flex-wrap:wrap}.filters>*{flex:1;min-width:130px}.login{max-width:430px;margin:12vh auto;padding:28px}.login input{margin:12px 0}.banner{border-left:3px solid var(--amber);padding:8px 12px;background:#2b2418;color:#f3d69c;font-size:12px;margin-bottom:18px}.notice{min-height:24px;color:var(--red);font-size:13px}.week{display:grid;grid-template-columns:90px 1fr;gap:15px;align-items:start}.week strong{font-size:29px;color:var(--cyan)}.week p{margin:6px 0;white-space:pre-wrap}.hidden{display:none!important}dialog{background:#121a26;color:var(--fg);border:1px solid #3b5366;border-radius:15px;padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000a}.task-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-content:start}@media(max-width:850px){.layout{display:block}aside{position:static;height:auto;gap:10px;padding:15px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}aside footer{display:none}main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid,.fields{grid-template-columns:1fr}.task{grid-template-columns:1fr}.task-actions{justify-content:flex-start}.week{grid-template-columns:1fr}header{align-items:flex-start}.brand{font-size:20px}}
.navgroup{display:grid;gap:3px;margin-bottom:12px}.navgroup .eyebrow{padding:6px 10px}.navgroup button{padding:7px 10px;font-size:13px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}aside{overflow:auto}aside nav{overflow:auto;flex:1}aside footer{margin-top:0}.review{color:#c4a6ff}.revise{color:var(--amber)}@media(max-width:850px){aside nav{display:flex;align-items:flex-start}.navgroup{display:flex;align-items:center;gap:4px}.navgroup .eyebrow{white-space:nowrap}}@media print{body{background:white;color:black}.layout{display:block}aside,header button,.banner,.notice,button,dialog{display:none!important}main{padding:0}.panel{background:white;color:black;border:1px solid #ccc;break-inside:avoid}.muted,small{color:#444}.tag{color:#333}}

/* Responsive 2.1: desktop sidebar, compact mobile navigation and touch controls. */
.mobile-menu{display:none}.navhead{display:flex;align-items:center;justify-content:space-between;gap:12px}main,.panel,.task>div,.fields>*{min-width:0}h1,h2,h3,.person,.tag,small,.notice{overflow-wrap:anywhere}.task label span{min-width:0;overflow-wrap:anywhere}.row>*{min-width:0}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.task{grid-template-columns:minmax(0,1fr) auto}.task-actions{max-width:270px}.login{width:min(430px,calc(100% - 32px))}dialog{max-width:calc(100% - 24px)}
@media(max-width:1050px){main{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.layout{display:block}aside{position:static;height:auto;overflow:visible;gap:0;padding:14px 16px;border-right:0;border-bottom:1px solid var(--line)}.mobile-menu{display:inline-flex;align-items:center;justify-content:center;min-height:44px;white-space:nowrap;color:var(--cyan)}aside nav{display:none;overflow:visible;flex:none;padding-top:12px}aside.menu-open nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}.navgroup{display:grid;gap:3px;margin-bottom:3px;align-content:start;min-width:0}.navgroup .eyebrow{white-space:normal}.navgroup button{min-height:44px;white-space:normal;overflow-wrap:anywhere}main{padding:18px 16px}.panel{padding:16px}.task-actions{max-width:none}button.small{min-height:40px}input,select,textarea{font-size:16px;min-height:44px}button{min-height:44px}.task input[type=checkbox]{width:24px;height:24px;min-height:0}.login{margin:5vh auto;padding:22px}.filters>*{min-width:0;flex:1 1 145px}.week{grid-template-columns:70px minmax(0,1fr)}dialog{padding:18px;max-height:85dvh}header{flex-wrap:wrap}header>div{min-width:0}header>div:last-child{max-width:100%}}
@media(max-width:480px){main{padding:16px 12px}.panel{padding:14px}.grid,.fields{grid-template-columns:minmax(0,1fr)}.stats{gap:8px}.stats .panel{margin-bottom:0}.stats{margin-bottom:14px}.stat b{font-size:29px}.task,.week{grid-template-columns:minmax(0,1fr)}.task-actions{justify-content:flex-start}.task-actions button{flex:1 1 auto}.filters>*{flex:1 1 100%}.brand{font-size:20px}.navgroup button{padding:8px;font-size:13px}header{gap:10px;margin-bottom:16px}header>div:last-child{width:100%}header>div:last-child .row{gap:8px}header .row button{flex:1}dialog{padding:14px}.row button{max-width:100%;white-space:normal}.login{padding:18px}.person{min-height:120px}}

</style></head><body><div id="app"></div><dialog id="modal"></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const ROSTER=[];
// Standalone preview: never make calls to a backend.
const demo=false;
let client=null;
if(!globalThis.BLACKOUT_CONFIG||!globalThis.supabase||BLACKOUT_CONFIG.key.includes('INSERISCI')){document.querySelector('#app').innerHTML='<div class="panel login"><h1>Configurazione necessaria</h1><p>Completa il file config.js con URL e chiave pubblica Supabase.</p></div>';throw Error('Configurazione Supabase mancante')}client=supabase.createClient(BLACKOUT_CONFIG.url,BLACKOUT_CONFIG.key);
const makeStorage=kind=>{const mem={};return {getItem(k){try{return window[kind].getItem(k)??mem[k]??null}catch{return mem[k]??null}},setItem(k,v){mem[k]=String(v);try{window[kind].setItem(k,v)}catch{}},removeItem(k){delete mem[k];try{window[kind].removeItem(k)}catch{}}}};
const localStore=makeStorage('localStorage'), sessionStore=makeStorage('sessionStorage');
let persistent=true;try{window.localStorage.setItem('__blackout_test','1');window.localStorage.removeItem('__blackout_test')}catch{persistent=false}
const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dates=['23–25 NOV 2026','30 NOV – 2 DIC 2026','11–13 GEN 2027','18–20 GEN 2027','25–27 GEN 2027','1–3 FEB 2027'];
const labels={todo:'Da svolgere',active:'In corso',review:'In revisione',revise:'Da correggere',done:'Approvato',late:'In ritardo',blocked:'Bloccato'};
let state, page='dashboard', chosen=25, team='all', status='all', query='', token=sessionStore.getItem('blackout.open.token')||'', busy=false;
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Rome',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dependencyBlocked=t=>!!t.dependencyId&&state.tasks.some(x=>x.id===t.dependencyId&&x.status!=='done');
const effective=t=>t.status==='done'?'done':(t.status==='blocked'||dependencyBlocked(t))?'blocked':t.status==='late'||(t.due&&t.due<today())?'late':t.status;
const overdue=t=>t.status!=='done'&&(t.status==='late'||(t.due&&t.due<today()));
const member=id=>state.members.find(m=>m.id==id), can=t=>state.me.admin||t.member===state.me.id;
const recordTypes=['daily','decisions','assets','bugs','builds','gdd','announcements','materials','diary','comments','activity'];
function normalize(s){s.records=s.records||{};recordTypes.forEach(k=>s.records[k]=s.records[k]||[]);return s}
function demoLoad(){let s;try{s=JSON.parse(localStore.getItem('blackout.demo.v1'))}catch{}return normalize(s||{me:{id:25,admin:1},members:ROSTER.map((r,i)=>({id:i+1,team:r[0],name:r[1],role:r[2],focus:r[3],admin:+(r[1]==='Aurora')})),tasks:[],milestones:dates.map((_,i)=>({id:i+1,title:'Da concordare',notes:'',status:'todo'})),meetings:[]})}
function saveDemo(){localStore.setItem('blackout.demo.v1',JSON.stringify(state))}
async function rpc(name,args={}){const {data,error}=await client.rpc(name,args);if(error)throw Error(error.message);return data}
async function refresh(){if(!demo)state=normalize(await rpc('hub_state',{actor:chosenIdentity}));render()}
let chosenIdentity=25;
async function mutate(path,data){if(busy)return;busy=true;try{if(demo){if(path==='task'){if(data.delete)state.tasks=state.tasks.filter(t=>t.id!==data.id);else {const t={...data,id:data.id||uid(),updated:new Date().toISOString()};state.tasks=[t,...state.tasks.filter(x=>x.id!==t.id)]}}else if(path==='milestone')state.milestones=state.milestones.map(m=>m.id===data.id?data:m);else if(path==='meeting')state.meetings.unshift({...data,id:uid()});else if(path==='member')state.members=state.members.map(m=>m.id===data.id?{...m,...data}:m);else if(path==='record'){const arr=state.records[data.kind];if(data.delete)state.records[data.kind]=arr.filter(x=>x.id!==data.id);else{const old=arr.find(x=>x.id===data.id);const item={...data,id:data.id||uid(),owner:old?.owner||state.me.id,updated:new Date().toISOString()};state.records[data.kind]=[item,...arr.filter(x=>x.id!==item.id)]}}state.records.activity.unshift({id:uid(),owner:state.me.id,title:path+' · '+(data.title||data.kind||data.id||'aggiornamento'),updated:new Date().toISOString()});saveDemo()}else await rpc('hub_mutate',{actor:chosenIdentity,kind:path,payload:data});await refresh();$('#modal').close()}catch(e){const n=$('#modal').open?$('#modal .notice'):$('#notice');if(n)n.textContent=e.message;else alert(e.message)}finally{busy=false}}
async function login(error=''){
 $('#app').innerHTML=`<div class="panel login"><div class="brand">BLACKOUT</div><p class="eyebrow">Production Hub / 2.3</p><h1>Entra nel progetto.</h1><h3>Team Workspace</h3><p class="muted">Inserisci la password comune del progetto, poi scegli il tuo nome.</p><form id="team-login"><input name="password" type="password" autocomplete="current-password" required placeholder="Password del gruppo" style="margin:8px 0"><button class="primary" style="width:100%">Accedi al team →</button></form><form id="login" hidden style="margin-top:14px"><label>Il tuo profilo</label><select id="profile-choice" name="member" required style="margin:12px 0"><option value="">Seleziona il tuo nome</option></select><button class="primary" style="width:100%">Entra →</button></form><div style="border-top:1px solid var(--line);margin:22px 0 14px;padding-top:14px"><h3>Control Room · Producer</h3><form id="admin-login"><input name="email" type="email" autocomplete="username" required placeholder="Email Producer" style="margin-top:8px"><input name="password" type="password" autocomplete="current-password" required placeholder="Password riservata" style="margin:8px 0"><button style="width:100%">Accedi alla Control Room</button></form></div><p class="notice" role="alert">${esc(error)}</p><small>I membri del team possono scegliere qualsiasi profilo non amministrativo. Non inserire dati sensibili.</small></div>`;
 const showError=e=>{$('.notice').textContent=e.message||String(e)};
 const profiles=async()=>{const ms=(await rpc('hub_state',{actor:1})).members;$('#profile-choice').innerHTML='<option value="">Seleziona il tuo nome</option>'+['Sopra','Sotto','Dentro'].map(g=>`<optgroup label="Team ${g}">${ms.filter(m=>m.team===g&&!m.admin).map(m=>`<option value="${m.id}">${esc(m.name)} — ${esc(m.role)}</option>`).join('')}</optgroup>`).join('');$('#login').hidden=false;$('#team-login').hidden=true;$('.notice').textContent='';};
 $('#team-login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const v=Object.fromEntries(new FormData(e.target));const r=await client.auth.signInWithPassword({email:'team@blackout.example.com',password:v.password});if(r.error)throw r.error;sessionStore.removeItem('blackout.v2.actor');await profiles()}catch(e){showError(e)}finally{b.disabled=false}};
 $('#login').onsubmit=async e=>{e.preventDefault();const id=Number(new FormData(e.target).get('member'));try{const data=await rpc('hub_state',{actor:id});chosenIdentity=id;state=normalize(data);sessionStore.setItem('blackout.v2.actor',id);chosen=id;page='profile';render()}catch(e){showError(e)}};
 $('#admin-login').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const v=Object.fromEntries(new FormData(e.target));const r=await client.auth.signInWithPassword(v);if(r.error)throw r.error;const data=normalize(await rpc('hub_state',{actor:25}));if(!data.me.admin)throw Error('Account non autorizzato');chosenIdentity=25;state=data;sessionStore.setItem('blackout.v2.actor',25);chosen=25;page='dashboard';render()}catch(e){showError(e)}finally{b.disabled=false}};
 try{const {data}=await client.auth.getSession();if(data.session)await profiles()}catch{};
}
function enterDemo(id){state=demoLoad();const m=state.members.find(x=>x.id===id);if(!m)return;state.me={id:m.id,admin:m.admin};chosen=id;chosenIdentity=id;sessionStore.setItem('blackout.v2.actor',id);page=m.admin?'dashboard':'profile';render()}
let mobileOpen=false;function toggleMenu(){mobileOpen=!mobileOpen;const a=document.querySelector('aside');a.classList.toggle('menu-open',mobileOpen);const b=document.querySelector('.mobile-menu');b.setAttribute('aria-expanded',String(mobileOpen));b.textContent=mobileOpen?'✕ Chiudi':'☰ Menu';}function go(p){mobileOpen=false;page=p;query='';team='all';status='all';render()}
function openMember(id){mobileOpen=false;chosen=Number(id);page='profile';render()}
function taskList(ts){if(!ts.length)return '<div class="empty">Nessun obiettivo. Il backlog è pronto per essere popolato.</div>';return ts.map(t=>{const s=effective(t);return `<div class="task"><div><label><input type="checkbox" ${['done','review'].includes(t.status)?'checked':''} ${can(t)?'':'disabled'} onchange="toggleTask('${t.id}',this.checked)"><span style="${t.status==='done'?'text-decoration:line-through;color:var(--muted)':''}">${esc(t.title)}</span></label><small>${esc(member(t.member)?.name)} · ${esc(member(t.member)?.team)} ${t.due?' · Scadenza '+esc(t.due):''}</small><div class="row"><span class="tag ${s}">${s==='late'?'! ':s==='done'?'✓ ':''}${labels[s]}</span>${overdue(t)&&s==='blocked'?'<span class="tag late">! Scaduto</span>':''}${t.priority==='high'?'<span class="tag late">Priorità alta</span>':''}</div>${t.notes?`<p>${esc(t.notes)}</p>`:''}${t.dependency?`<p class="muted">↳ Dipendenza: ${esc(t.dependency)}</p>`:''}${t.dependencyId?`<p class="muted">↳ Attende: ${esc(state.tasks.find(x=>x.id===t.dependencyId)?.title||'Obiettivo rimosso')}</p>`:''}<button class="small" onclick="commentTask('${t.id}')">Commenti (${state.records.comments.filter(x=>x.target===t.id).length})</button></div>${can(t)?`<div class="task-actions"><button class="small" onclick="quick('${t.id}','active')">In corso</button><button class="small danger" onclick="quick('${t.id}','late')">! Ritardo</button><button class="small blocked" onclick="quick('${t.id}','blocked')">Blocco</button>${state.me.admin&&t.status==='review'?`<button class="small done" onclick="quick('${t.id}','done')">✓ Approva</button><button class="small blocked" onclick="quick('${t.id}','revise')">Da correggere</button>`:''}<button class="small" onclick="editTask('${t.id}')">Modifica</button></div>`:''}</div>`}).join('')}
function quick(id,s){if(s==='done'&&!state.me.admin)return;let t=state.tasks.find(x=>x.id===id);mutate('task',{...t,status:t.status===s?'todo':s})}function toggleTask(id,v){let t=state.tasks.find(x=>x.id===id);mutate('task',{...t,status:v?(state.me.admin?'done':'review'):'todo'})}
function stats(ts){let done=ts.filter(t=>t.status==='done').length,late=ts.filter(overdue).length,active=ts.filter(t=>effective(t)==='active').length;return `<div class="stats">${[['Obiettivi',ts.length,''],['Completati',done,'done'],['In corso',active,'active'],['In ritardo',late,'late']].map(([n,v,c])=>`<div class="panel stat"><small>${n}</small><b class="${c}">${v}</b></div>`).join('')}</div><div class="panel"><div class="row between"><h3>Avanzamento</h3><b>${ts.length?Math.round(done/ts.length*100):0}%</b></div><div class="progress"><i style="width:${ts.length?done/ts.length*100:0}%"></i></div><small>${done} di ${ts.length} obiettivi approvati · ${ts.filter(t=>t.status==='review').length} in revisione · ${ts.filter(t=>effective(t)==='blocked').length} bloccati</small></div>`}
function dashboard(){return (state.me.admin?`<div class="panel"><div class="row between"><div><div class="eyebrow">PRODUCER / AURORA</div><h2 style="margin:4px 0">Centro di coordinamento</h2><small>Revisioni, criticità e diario personale</small></div><div class="row"><button class="small" onclick="go('diary')">Diario privato →</button><button class="small" onclick="go('report')">Production Book →</button><button class="primary" onclick="go('daily')">Daily Updates →</button></div></div></div>`:'')+stats(state.tasks)+`<div class="grid">${['Sopra','Sotto','Dentro'].map(g=>{const ms=state.members.filter(m=>m.team===g),ts=state.tasks.filter(t=>member(t.member)?.team===g),d=ts.filter(t=>t.status==='done').length;return `<div class="panel"><span class="tag ${g}">TEAM ${g.toUpperCase()}</span><h2 style="margin-top:10px">${ms.length} componenti</h2><div class="progress"><i style="width:${ts.length?100*d/ts.length:0}%"></i></div><small>${d}/${ts.length} obiettivi completati · ${ts.filter(overdue).length} in ritardo</small><p><button class="small" onclick="go('team');team='${g}';render()">Apri team →</button></p></div>`}).join('')}</div><div class="panel"><h2>Criticità da monitorare</h2>${taskList(state.tasks.filter(t=>overdue(t)||effective(t)==='blocked'))}</div>${state.me.admin?`<div class="panel"><h2>In attesa di approvazione (${state.tasks.filter(t=>t.status==='review').length})</h2>${taskList(state.tasks.filter(t=>t.status==='review'))}</div>`:''}<div class="panel"><h2>Ultimi aggiornamenti</h2>${taskList(state.tasks.slice(0,5))}</div>`}
function teamView(){return `<div class="filters"><select onchange="team=this.value;render()">${[['all','Tutti i team'],['Sopra','Team Sopra'],['Sotto','Team Sotto'],['Dentro','Team Dentro']].map(([v,l])=>`<option value="${v}" ${team===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="grid">${state.members.filter(m=>team==='all'||m.team===team).map(m=>{let ts=state.tasks.filter(t=>t.member===m.id);return `<div class="panel person" role="button" tabindex="0" onclick="openMember(${m.id})" onkeydown="if(event.key==='Enter')openMember(${m.id})"><span class="tag ${m.team}">TEAM ${m.team.toUpperCase()}</span><h3>${esc(m.name)}</h3><small>${esc(m.role)}</small><small>${ts.filter(t=>t.status==='done').length}/${ts.length} completati · ${ts.filter(overdue).length} in ritardo</small></div>`}).join('')}</div>`}
function profile(){const m=member(chosen)||member(state.me.id);const ts=state.tasks.filter(t=>t.member===m.id);return `<div class="panel"><div class="row between"><span class="tag ${m.team}">TEAM ${m.team.toUpperCase()}</span>${state.me.admin?`<button class="small" onclick="editMember(${m.id})">Modifica profilo</button>`:''}</div><h1>${esc(m.name)}</h1><h3>${esc(m.role)}</h3><p class="muted">${esc(m.focus)}</p></div>${stats(ts)}<div class="panel"><div class="row between"><h2>Obiettivi individuali</h2>${state.me.admin||m.id===state.me.id?`<button class="primary" onclick="editTask('',${m.id})">＋ Aggiungi obiettivo</button>`:''}</div>${taskList(ts)}</div>`}
function backlog(){let ts=state.tasks.filter(t=>(team==='all'||member(t.member)?.team===team)&&(status==='all'||effective(t)===status||(status==='late'&&overdue(t)))&&(!query||[t.title,member(t.member)?.name,t.notes].join(' ').toLowerCase().includes(query.toLowerCase())));return `<div class="panel"><div class="row between"><h2>Backlog generale</h2><button class="primary" onclick="editTask()">＋ Aggiungi obiettivo</button></div><div class="filters"><select onchange="team=this.value;render()">${['all','Sopra','Sotto','Dentro'].map(x=>`<option ${team===x?'selected':''} value="${x}">${x==='all'?'Tutti i team':x}</option>`).join('')}</select><select onchange="status=this.value;render()"><option value="all">Tutti gli stati</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${status===k?'selected':''}>${v}</option>`).join('')}</select><form onsubmit="event.preventDefault();query=this.q.value;render()"><input name="q" value="${esc(query)}" placeholder="Cerca e premi Invio"></form></div>${taskList(ts)}</div>`}
function milestones(){return `<p class="muted">Sei settimane didattiche · Pausa dal 3 dicembre al 10 gennaio. Traguardi da concordare con il team.</p>${state.milestones.map(m=>`<div class="panel week"><div><span class="eyebrow">SETTIMANA</span><br><strong>0${m.id}</strong></div><div><small>${dates[m.id-1]}</small><div class="row between"><h2>${esc(m.title)}</h2><span class="tag ${m.status}">${labels[m.status]}</span></div><p>${esc(m.notes)}</p>${state.me.admin?`<button class="small" onclick="editMilestone(${m.id})">Modifica milestone</button>`:''}</div></div>`).join('')}`}
function meetings(){return `<div class="row between"><h2>Verbali e decisioni</h2>${state.me.admin?'<button class="primary" onclick="editMeeting()">＋ Nuovo verbale</button>':''}</div>${state.meetings.length?state.meetings.map(m=>`<div class="panel"><small>${esc(m.date)}</small><h2>${esc(m.title)}</h2><p style="white-space:pre-wrap">${esc(m.notes)}</p></div>`).join(''):'<div class="panel empty">Nessun verbale registrato.</div>'}`}
const modules={daily:['Daily Updates','Aggiornamenti quotidiani', 'Titolo aggiornamento','Attività svolte oggi','Prossimo obiettivo'],decisions:['Registro decisioni','Decisioni concordate','Decisione','Motivazione / contesto','Responsabili e conseguenze'],assets:['Asset Tracker','Modelli, texture, animazioni e materiali','Nome asset','Specifiche / note','Link o posizione del file'],bugs:['Bug Tracker','Segnalazioni e test','Problema','Passaggi per riprodurlo / risultato atteso','Versione / ambiente'],builds:['Build Tracker','Versioni giocabili','Versione build','Novità / risultati dei test','Link alla build'],gdd:['Game Design Document','Documento di design condiviso','Sezione','Contenuto','Riferimenti'],announcements:['Annunci','Bacheca del progetto','Titolo','Comunicazione','Riferimenti'],materials:['Documentazione','Archivio di risorse e collegamenti','Materiale','Descrizione','Link'],diary:['Production Diary','Area privata della Producer','Titolo','Riflessioni e attività','Problemi, decisioni e prossimi passi']};
const adminOnly=['diary','activity','report','settings'];
function moduleView(kind){const m=modules[kind];let rs=state.records[kind]||[];const write=state.me.admin||!['decisions','announcements','gdd','diary'].includes(kind);return `<div class="panel"><div class="row between"><div><h2>${m[0]}</h2><small>${m[1]}</small></div>${write?`<button class="primary" onclick="editRecord('${kind}')">＋ Nuovo</button>`:''}</div></div>${rs.length?rs.map(r=>`<article class="panel"><div class="row between"><small>${esc(r.date||'')} · ${esc(member(r.owner)?.name||'Producer')}</small><span class="tag ${r.status||''}">${esc(labels[r.status]||r.status||'Registrato')}</span></div><h2>${esc(r.title)}</h2><p class="pre">${esc(r.notes)}</p>${r.detail?`<p class="pre muted">${esc(r.detail)}</p>`:''}${r.extra?`<p class="pre">${esc(r.extra)}</p>`:''}${(state.me.admin||r.owner===state.me.id)&&write?`<button class="small" onclick="editRecord('${kind}','${r.id}')">Modifica</button>`:''}</article>`).join(''):'<div class="panel empty">Nessuna voce registrata.</div>'}`}
function editRecord(kind,id=''){let r=state.records[kind].find(x=>x.id===id)||{},m=modules[kind];dialog(m[0],input('Data','date',r.date||today(),'date',true)+input(m[2],'title',r.title||'','text',true,true)+textarea(m[3],'notes',r.notes||'')+textarea(m[4],'detail',r.detail||'')+(kind==='daily'?textarea('Problemi o blocchi','extra',r.extra||''):'')+(['assets','bugs','builds'].includes(kind)?sel('Stato','status',Object.entries(labels).filter(([k])=>state.me.admin||!['done','revise'].includes(k)),r.status||'todo'):'') ,v=>mutate('record',{...v,kind,id}),id?`<button type="button" class="danger" onclick="if(confirm('Eliminare questa voce?'))mutate('record',{kind:'${kind}',id:'${id}',delete:true})">Elimina</button>`:'')}
function commentTask(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;dialog('Commenti · '+esc(t.title),`<div class="wide">${state.records.comments.filter(r=>r.target===id).map(r=>`<p class="pre"><small>${esc(member(r.owner)?.name)} · ${esc(r.date)}</small><br>${esc(r.notes)}</p>`).join('')||'<small>Nessun commento.</small>'}</div>`+textarea('Nuovo commento','notes'),v=>{if(!v.notes.trim())return;mutate('record',{kind:'comments',target:id,title:'Commento',date:today(),notes:v.notes})})}
function dependencies(){let ts=state.tasks.filter(t=>t.dependency||t.dependencyId||t.status==='blocked');return `<div class="panel"><h2>Dipendenze e blocchi</h2><small>Le attività collegate a un obiettivo non approvato sono segnalate come bloccate.</small>${taskList(ts)}</div>`}
function calendar(){return `<div class="panel"><h2>Calendario didattico</h2><small>Lunedì–mercoledì · 14:00–18:15 · Aurora 14:00–16:00</small></div>`+milestones()+`<div class="panel"><h2>Scadenze degli obiettivi</h2>${taskList(state.tasks.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)))}</div>`}
function report(){let t=state.tasks, done=t.filter(x=>x.status==='done');return `<div class="panel"><div class="row between"><h2>Report di produzione</h2><button class="primary" onclick="window.print()">Stampa / PDF</button></div><p class="muted">Riepilogo aggiornato al ${today()} · ${t.length} obiettivi, ${done.length} approvati, ${t.filter(overdue).length} scaduti.</p></div>${dashboard()}<div class="panel"><h2>Decisioni, meeting e diario</h2>${[...state.meetings,...state.records.decisions,...state.records.diary].map(r=>`<p class="pre"><b>${esc(r.date)} · ${esc(r.title)}</b>\n${esc(r.notes)}</p>`).join('')||'<small>Ancora nessuna voce.</small>'}</div><div class="panel"><h2>Daily Updates</h2>${state.records.daily.map(r=>`<p class="pre"><b>${esc(r.date)} · ${esc(member(r.owner)?.name)} · ${esc(r.title)}</b>\n${esc(r.notes)}\n${esc(r.detail)}\n${esc(r.extra)}</p>`).join('')||'<small>Nessun aggiornamento.</small>'}</div>`}
function activity(){return `<div class="panel"><h2>Cronologia</h2><small>Il nome selezionato dai colleghi non è un'identità verificata.</small>${state.records.activity.map(r=>`<p><small>${esc(r.updated)} · ${esc(member(r.owner)?.name)}</small><br>${esc(r.title)}</p>`).join('')||'<p class="muted">Nessuna modifica.</p>'}</div>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='blackout-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function settings(){return `<div class="panel"><h2>Gestione e backup</h2><p>Esporta una copia JSON dei dati del progetto. Il file include anche il diario privato: conservalo in un luogo sicuro.</p><button class="primary" onclick="backup()">Esporta backup</button><p class="muted">${demo?'Demo locale: nessuna autenticazione effettiva.':'L’area Producer richiede l’account Supabase autorizzato. I profili dei colleghi non sono verificati.'}</p></div>`}
function render(){if(adminOnly.includes(page)&&!state.me.admin)page='profile';const titles={dashboard:state.me.admin?'Control Room':'Panoramica team',team:'Il team',profile:'Scheda personale',backlog:'Backlog',milestones:'Roadmap',meetings:'Meeting & decisioni',dependencies:'Dipendenze',calendar:'Calendario',report:'Production Book',activity:'Cronologia modifiche',settings:'Gestione progetto',...Object.fromEntries(Object.entries(modules).map(([k,v])=>[k,v[0]]))};let navs=[['PRODUZIONE',[['dashboard','◈ Dashboard'],['team','◎ Team'],['profile','◉ Il mio profilo'],['backlog','☷ Backlog'],['calendar','▦ Calendario'],['milestones','◇ Milestones'],['dependencies','↳ Dipendenze']]],['SVILUPPO',[['gdd','▤ GDD'],['assets','◫ Asset Tracker'],['bugs','! Bug Tracker'],['builds','□ Build Tracker']]],['COORDINAMENTO',[['daily','↻ Daily Updates'],['meetings','▤ Meeting'],['decisions','✓ Decisioni'],['announcements','◉ Annunci'],['materials','▧ Documentazione']]]];if(state.me.admin)navs.push(['AREA PRODUCER',[['report','▥ Report / Production Book'],['diary','▤ Production Diary'],['activity','↻ Cronologia'],['settings','⚙ Gestione progetto']]]);const view=({dashboard,team:teamView,profile,backlog,milestones,meetings,dependencies,calendar,report,activity,settings})[page];$('#app').innerHTML=`<div class="layout"><aside class="${mobileOpen?'menu-open':''}"><div class="navhead"><div><div class="brand">ϟ BLACKOUT</div><div class="eyebrow">${state.me.admin?'CONTROL ROOM':'TEAM WORKSPACE'} / 2.1</div></div><button class="mobile-menu" aria-expanded="${mobileOpen}" aria-controls="main-navigation" onclick="toggleMenu()">${mobileOpen?'✕ Chiudi':'☰ Menu'}</button></div><nav id="main-navigation">${navs.map(([g,items])=>`<div class="navgroup"><div class="eyebrow">${g}</div>${items.map(([p,l])=>`<button class="${page===p?'on':''}" onclick="${p==='profile'?'openMember(state.me.id)':'go(\''+p+'\')'}">${l}</button>`).join('')}</div>`).join('')}</nav><footer>ACCADEMIA DI BELLE ARTI DI CATANIA<br>Animazione 3D avanzate × Game Engine</footer></aside><main><header><div><div class="eyebrow">PROJECT / BLACKOUT</div><h1>${titles[page]}</h1><small>${state.me.admin?'Area di coordinamento riservata':'Workspace condiviso'}</small></div><div><span class="tag ${member(state.me.id)?.team}">${esc(member(state.me.id)?.name)}${state.me.admin?' · Producer':''}</span><div class="row" style="margin-top:8px"><button class="small" onclick="refresh().catch(e=>alert(e.message))">↻ Aggiorna</button><button class="small" onclick="logout()">Cambia profilo</button></div></div></header><div class="banner">${demo?'ANTEPRIMA LOCALE — Dati non condivisi, area privata simulata.':'WORKSPACE ONLINE — Selezione libera dei profili non amministrativi.'}</div><div id="notice" class="notice"></div>${view?view():moduleView(page)}</main></div>`}
function dialog(title,fields,submit,extra=''){const d=$('#modal');d.innerHTML=`<div class="row between"><h2>${title}</h2><button class="small" onclick="this.closest('dialog').close()">✕</button></div><form id="editor"><div class="fields">${fields}</div><p class="notice"></p><div class="row between">${extra}<button class="primary" type="submit">Salva</button></div></form>`;d.showModal();$('#editor').onsubmit=e=>{e.preventDefault();submit(Object.fromEntries(new FormData(e.target)))}}
const input=(label,name,value='',type='text',required=false,wide=false)=>`<label class="${wide?'wide':''}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;
const textarea=(label,name,value='')=>`<label class="wide">${label}<textarea name="${name}" rows="3">${esc(value)}</textarea></label>`;
const sel=(label,name,options,value)=>`<label>${label}<select name="${name}">${options.map(([k,v])=>`<option value="${esc(k)}" ${String(k)===String(value)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
function editTask(id='',owner=state.me.id){const t=state.tasks.find(x=>x.id===id)||{member:owner,title:'',due:'',status:'todo',priority:'normal',notes:'',dependency:''};dialog(id?'Modifica obiettivo':'Nuovo obiettivo',input('Obiettivo','title',t.title,'text',true,true)+sel('Responsabile','member',state.members.filter(m=>state.me.admin||m.id===state.me.id).map(m=>[m.id,m.name]),t.member)+input('Scadenza','due',t.due,'date')+sel('Stato','status',Object.entries(labels).filter(([k])=>state.me.admin||!['done','revise'].includes(k)),t.status)+sel('Priorità','priority',[['normal','Normale'],['high','Alta'],['low','Bassa']],t.priority)+input('Dipendenza / lavoro atteso','dependency',t.dependency,'text',false,true)+sel('Obiettivo da cui dipende','dependencyId',[['','Nessuno'],...state.tasks.filter(x=>x.id!==id).map(x=>[x.id,x.title])],t.dependencyId||'')+textarea('Note e aggiornamenti','notes',t.notes),v=>mutate('task',{...v,member:Number(v.member),id}),id?`<button type="button" class="danger" onclick="if(confirm('Eliminare questo obiettivo?'))mutate('task',{id:'${id}',member:${t.member},delete:true})">Elimina</button>`:'')}
function editMilestone(id){let m=state.milestones.find(x=>x.id===id);dialog('Milestone 0'+id,input('Traguardo','title',m.title,'text',true,true)+sel('Stato','status',Object.entries(labels).filter(([k])=>['todo','active','done'].includes(k)),m.status)+textarea('Criteri e note','notes',m.notes),v=>mutate('milestone',{...v,id}))}
function editMeeting(){dialog('Nuovo verbale',input('Data','date',today(),'date',true)+input('Titolo','title','','text',true)+textarea('Decisioni, azioni, responsabili e scadenze','notes'),v=>mutate('meeting',v))}
function editMember(id){let m=member(id);dialog('Modifica profilo',input('Nome','name',m.name,'text',true,true)+input('Ruolo','role',m.role,'text',true,true)+textarea('Focus','focus',m.focus),v=>mutate('member',{...v,id}))}
async function logout(){sessionStore.removeItem('blackout.v2.actor');if(!demo)await client.auth.signOut({scope:'local'});state=null;login()}
(async()=>{if(demo){enterDemo(Number(sessionStore.getItem('blackout.v2.actor'))||25)}else{const {data}=await client.auth.getSession();let id=Number(sessionStore.getItem('blackout.v2.actor'));if(data.session&&id){try{chosenIdentity=id;state=normalize(await rpc('hub_state',{actor:id}));chosen=id;page=state.me.admin?'dashboard':'profile';render();return}catch{}}login()}})();
setInterval(()=>{if(!demo&&state&&!busy&&!$('#modal').open&&!document.hidden&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))refresh().catch(()=>{});},30000);
</script></body></html>
